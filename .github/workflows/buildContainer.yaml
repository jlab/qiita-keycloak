name: docker

on:
  push:
    branches:
      - 'smaller_deblur'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from file
        id: vars
        run: |
          VERSION=$(head -n 1 Images/qp-deblur/qp-deblur.dockerfile | cut -d ":" -f 2- | tr -d " ")
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          cp Images/qp-deblur/start_qp-deblur.sh Images/qp-deblur/trigger_noconda.py .
          mkdir -p qiita_server_certificates/
          echo "fake" > qiita_server_certificates/qiita_server_certificates.pem
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Images/qp-deblur/qp-deblur.dockerfile
          tags: ${{ vars.DOCKERHUB_USERNAME }}/tinqiita-qp-deblur:${{ env.IMAGE_TAG }}