name: docker

on:
  push:
    branches:
      - 'smaller_deblur'

jobs:
  docker:
    strategy:
      matrix:
        plugin: ["qp-deblur",  #, "qtp-biom", "qp-target-gene", "qtp-sequencing", "nginx", "qtp-visualization", "qtp-diversity",
                 "qiita", "plugin_collector"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from file
        id: vars
        run: |
          VERSION=$(head -n 1 Images/${{ matrix.plugin }}/${{ matrix.plugin }}.dockerfile | cut -d ":" -f 2- | tr -d " ")
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          cp Images/${{ matrix.plugin }}/start_${{ matrix.plugin }}.sh Images/qp-deblur/trigger_noconda.py Images/qtp-biom/trigger.py Images/nginx/nginx_qiita.conf Images/${{ matrix.plugin }}/requirements.txt .
          cp Images/qiita/config_portal.cfg Images/qiita/config_qiita_oidc.cfg Images/qiita/drop_workflows.py Images/qiita/start_plugin.py Images/qiita/start_qiita-initDB.sh Images/qiita/start_qiita.sh .
          cp Images/plugin_collector/collect_configs.py Images/plugin_collector/fix_test_db.py Images/plugin_collector/stefan_cert.conf Images/plugin_collector/stefan_csr.conf .
          mkdir -p qiita_server_certificates/
          echo "fake" > qiita_server_certificates/qiita_server_certificates.pem
          echo "fake" > qiita_server_certificates/fake_server.crt
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Images/${{ matrix.plugin }}/${{ matrix.plugin }}.dockerfile
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.plugin }}:${{ env.IMAGE_TAG }}

      - name: Make tinqiita targets
        run: |
          make ./references/qiita_server_certificates ./references/qp-deblur/reference-gg-raxml-bl.tre

      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: "compose_github.yaml"