# todo: "make" files once and push around through artifacts!

name: docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  # one tag per workflow run: parallel runs (PR vs. main) cannot overwrite each other's images
  CI_TAG: ci-${{ github.run_id }}

jobs:
  define_images:
    runs-on: ubuntu-latest
    outputs:
      main:    ${{ steps.def.outputs.main }}    # images for qiita main, i.e. nginx, qiita, plugin_collector
      plugins: ${{ steps.def.outputs.plugins }} # single image plugins, currently: qp-deblur, qtp-biom, qtp-sequencing, qtp-visualization, qtp-diversity, qp-target-gene, qtp-job-output-folder, qtp-genome but should be easily extendable
      multi:   ${{ steps.def.outputs.multi }}   # plugins that require other plugins to be present too, currently only qp-qiime2
      all:     ${{ steps.def.outputs.all }}     # all of the above
    steps:
      - id: def
        run: |
          MAIN='["nginx","qiita","plugin_collector"]'
          PLUGINS='["qp-deblur","qtp-biom","qtp-sequencing","qtp-visualization","qtp-diversity","qp-target-gene","qtp-job-output-folder","qtp-genome"]'
          MULTI='["qp-qiime2"]'
          echo "main=$MAIN"       >> $GITHUB_OUTPUT
          echo "plugins=$PLUGINS" >> $GITHUB_OUTPUT
          echo "multi=$MULTI"     >> $GITHUB_OUTPUT
          echo "all=$(jq -nc --argjson a "$MAIN" --argjson b "$PLUGINS" --argjson c "$MULTI" '$a+$b+$c')" >> $GITHUB_OUTPUT

  make_certificates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tinqiita repo
        uses: actions/checkout@v6

      - name: Create certificate
        # second copy of "./Certificates" is necessary to match path for docker build, first copy for mounting into container
        run: |
          sed -i "s/^SECURE_QIITA_DB = True/SECURE_QIITA_DB = False/" ./Configuration/makefile
          make ./references/Certificates/tinqiita propagate_configuration
          cp -r ./references/Certificates ./Certificates

      - name: Store certifactes for follow up jobs
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: certificates
          path: |
            ./Certificates
            ./references/Certificates/tinqiita
            ./Configuration

  build_main:
    needs: make_certificates
    strategy:
      matrix:
        container: ${{ fromJSON(needs.define_images.outputs.main) }}
    runs-on: ubuntu-latest
    env:
      GIT_QIITA_FORK: "jlab"
      GIT_QIITA_BRANCH: "auth_oidc"
    steps:
      - name: Checkout tinqiita repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read image version from dockerfile
        id: vars
        run: |
          VERSION=$(head -n 1 Images/${{ matrix.container }}/${{ matrix.container }}.dockerfile | cut -d ":" -f 2- | tr -d " ")
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          cp Images/start_plugin.sh Images/test_plugin.sh Configuration/nginx_qiita.conf Images/${{ matrix.container }}/requirements.txt Images/nginx/start_nginx.sh .
          cp Configuration/config_portal.cfg Configuration/config_qiita_oidc.cfg Images/qiita/drop_workflows.py Images/qiita/secure_db.py Images/qiita/start_plugin.py Images/qiita/start_qiita-initDB.sh Images/qiita/start_qiita.sh .
          cp Images/plugin_collector/collect_configs.py Images/plugin_collector/fix_test_db.py Configuration/tinqiita_cert.conf Configuration/tinqiita_csr.conf Images/plugin_collector/start_plugin_collector.sh .
          for f in $(find Images/ -name patch.sql | sort); do cat "$f"; echo; done > 96.sql

      - name: Download certificates from job build_main
        uses: actions/download-artifact@v8
        with:
          name: certificates
          path: ./          

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit-hash of qiita
        run: |
          echo "CACHEBURST_QIITA=$(git ls-remote https://github.com/$GIT_QIITA_FORK/qiita.git refs/heads/$GIT_QIITA_BRANCH | cut -f1)" >> $GITHUB_ENV

      - name: Build main qiita images and push to github's own registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CACHEBURST_QIITA=${{ env.CACHEBURST_QIITA }}
            GIT_QIITA_FORK=${{ env.GIT_QIITA_FORK }}
            GIT_QIITA_BRANCH=${{ env.GIT_QIITA_BRANCH }}
          file: Images/${{ matrix.container }}/${{ matrix.container }}.dockerfile
          tags: ghcr.io/${{ github.repository }}/${{ matrix.container }}:${{ env.CI_TAG }}
          platforms: linux/amd64

  make_references:
    needs: build_main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tinqiita repo
        uses: actions/checkout@v6

      - name: Create partially fake reference databases
        run: |
          mkdir -p ./references/qp-deblur/ ./references/qp-target-gene
          make ./references/qp-deblur/reference-gg-raxml-bl.tre
          for f in `echo "references/qp-target-gene/97_otus.fasta references/qp-target-gene/97_otus.tree references/qp-target-gene/97_otu_taxonomy.txt"`; do echo "fake" > $f; done

      - name: Store fake references for follow up jobs
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: fake_references
          path: |
            ./references/qp-deblur
            ./references/qp-target-gene

  build_plugins:
    needs:
      - build_main
      - make_references
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.define_images.outputs.plugins) }}
    runs-on: ubuntu-latest
    env:
      GIT_PLUGIN_FORK: "qiita-spots"
      GIT_PLUGIN_BRANCH: "master"
      GIT_QIITACLIENT_FORK: "qiita-spots"
      GIT_QIITACLIENT_BRANCH: "master"
    steps:
      - name: Checkout tinqiita repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read image version from dockerfile
        id: vars
        run: |
          VERSION=$(head -n 1 Images/${{ matrix.plugin }}/${{ matrix.plugin }}.dockerfile | cut -d ":" -f 2- | tr -d " ")
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          cp Images/start_plugin.sh Images/test_plugin.sh Images/${{ matrix.plugin }}/requirements.txt Images/trigger.py .
          mkdir -p ./debug

      - name: Download certificates from job build_main
        uses: actions/download-artifact@v8
        with:
          name: certificates
          path: ./
      - name: Download fake references
        uses: actions/download-artifact@v8
        with:
          name: fake_references
          path: ./references

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit-hash of qiita_client and plugin
        env:
          GIT_PLUGIN_BRANCH: ${{ (env.GIT_PLUGIN_BRANCH == 'master' && matrix.plugin == 'qtp-job-output-folder') && 'main' || env.GIT_PLUGIN_BRANCH }}
        run: |
          echo "CACHEBURST_PLUGIN=$(git ls-remote https://github.com/$GIT_PLUGIN_FORK/${{ matrix.plugin }}.git refs/heads/$GIT_PLUGIN_BRANCH | cut -f1)" >> $GITHUB_ENV
          echo "CACHEBURST_QIITACLIENT=$(git ls-remote https://github.com/$GIT_QIITACLIENT_FORK/qiita_client.git refs/heads/$GIT_QIITACLIENT_BRANCH | cut -f1)" >> $GITHUB_ENV

      - name: Build plugin images
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            CACHEBURST_QIITACLIENT=${{ env.CACHEBURST_QIITACLIENT }}
            CACHEBURST_PLUGIN=${{ env.CACHEBURST_PLUGIN }}
            GIT_PLUGIN_FORK=${{ (matrix.plugin == 'qtp-genome') && 'jlab' || env.GIT_PLUGIN_FORK }}
            GIT_PLUGIN_BRANCH=${{ ((env.GIT_PLUGIN_BRANCH == 'master' && matrix.plugin == 'qtp-job-output-folder') || (matrix.plugin == 'qtp-genome')) && 'main' || env.GIT_PLUGIN_BRANCH }}
            GIT_QIITACLIENT_FORK=${{ env.GIT_QIITACLIENT_FORK }}
            GIT_QIITACLIENT_BRANCH=${{ env.GIT_QIITACLIENT_BRANCH }}
          file: Images/${{ matrix.plugin }}/${{ matrix.plugin }}.dockerfile
          tags: ghcr.io/${{ github.repository }}/${{ matrix.plugin }}:${{ env.CI_TAG }}
          platforms: linux/amd64
          load: true
          push: true

      - name: Pull images of this run from GHCR
        run: |
          docker pull ghcr.io/${{ github.repository }}/qiita:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/nginx:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/plugin_collector:${{ env.CI_TAG }}

      - name: adapt compose file to select specific plugin
        run: |
          bash .github/workflows/adapt_compose.yaml.sh ./compose.yaml ${{ matrix.plugin }} ${{ env.CI_TAG }}

      - name: Log in to DockerHub Container Registry
        # this is to evade public pull rate limits of 100 pulls per 6h for redis and postgres images
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: "compose.yaml"
          services: |
            nginx
      - name: Check which qiita and plugin image is actually running
        run: |
          docker inspect ghcr.io/${{ github.repository }}/qiita:${{ env.CI_TAG }} --format '{{.Id}}'
          docker inspect ghcr.io/${{ github.repository }}/${{ matrix.plugin }}:${{ env.CI_TAG }} --format '{{.Id}}'
      - name: Show docker compose logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Inspect plugin container and qiita DB for debugging
        run: |
          docker compose exec ${{ matrix.plugin }} /bin/bash -c "ls -la /; ls -la /unshared_plugins/; cat /unshared_plugins/*;" || true
          docker compose exec qiita-db psql -U postgres -d qiita_test -c "SELECT * FROM qiita.software;" || true

      - name: Execute tests in the running services
        env:
          GIT_PLUGIN_BRANCH: ${{ (env.GIT_PLUGIN_BRANCH == 'master' && matrix.plugin == 'qtp-job-output-folder') && 'main' || env.GIT_PLUGIN_BRANCH }}
        run: |
          sleep 10
          docker compose exec ${{ matrix.plugin }} /bin/bash -c "PLUGIN_FORK=${{ env.GIT_PLUGIN_FORK }} PLUGIN_BRANCH=${{ env.GIT_PLUGIN_BRANCH }} bash /test_plugin.sh"

      - name: Show Debug Logfiles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: debug logs
          path: ./debug


  # the qp-qiime2 plugin cannot be tested in isolation, it also needs qtp-diversity and qtp-visualization to be active in qiita
  build_mulit_plugins:
    needs:
      - build_plugins
    strategy:
      matrix:
        multiplugin: ${{ fromJSON(needs.define_images.outputs.multi) }}
    runs-on: ubuntu-latest
    env:
      GIT_PLUGIN_FORK: "qiita-spots"
      GIT_PLUGIN_BRANCH: "master"
      GIT_QIITACLIENT_FORK: "qiita-spots"
      GIT_QIITACLIENT_BRANCH: "master"
    steps:
      - name: Checkout tinqiita repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read image version from dockerfile
        id: vars
        run: |
          VERSION=$(head -n 1 Images/${{ matrix.multiplugin }}/${{ matrix.multiplugin }}.dockerfile | cut -d ":" -f 2- | tr -d " ")
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV
          cp Images/start_plugin.sh Images/test_plugin.sh Images/${{ matrix.multiplugin }}/requirements.txt Images/trigger.py .

      - name: Download certificates from job build_main
        uses: actions/download-artifact@v8
        with:
          name: certificates
          path: ./
      - name: Download fake references
        uses: actions/download-artifact@v8
        with:
          name: fake_references
          path: ./

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit-hash of qiita_client and plugin
        run: |
          echo "CACHEBURST_PLUGIN=$(git ls-remote https://github.com/$GIT_PLUGIN_FORK/${{ matrix.multiplugin }}.git refs/heads/$GIT_PLUGIN_BRANCH | cut -f1)" >> $GITHUB_ENV
          echo "CACHEBURST_QIITACLIENT=$(git ls-remote https://github.com/$GIT_QIITACLIENT_FORK/qiita_client.git refs/heads/$GIT_QIITACLIENT_BRANCH | cut -f1)" >> $GITHUB_ENV

      - name: Build plugin images
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            CACHEBURST_QIITACLIENT=${{ env.CACHEBURST_QIITACLIENT }}
            CACHEBURST_PLUGIN=${{ env.CACHEBURST_PLUGIN }}
            GIT_PLUGIN_FORK=${{ env.GIT_PLUGIN_FORK }}
            GIT_PLUGIN_BRANCH=${{  env.GIT_PLUGIN_BRANCH }}
            GIT_QIITACLIENT_FORK=${{ env.GIT_QIITACLIENT_FORK }}
            GIT_QIITACLIENT_BRANCH=${{ env.GIT_QIITACLIENT_BRANCH }}
          file: Images/${{ matrix.multiplugin }}/${{ matrix.multiplugin }}.dockerfile
          tags: ghcr.io/${{ github.repository }}/${{ matrix.multiplugin }}:${{ env.CI_TAG }}
          platforms: linux/amd64
          load: false
          push: true

      - name: Prune build cache after build (saving disc space)
        run: |
          df -h /
          docker buildx prune -af
          df -h /

      - name: adapt compose file to select specific plugin
        run: |
          bash .github/workflows/adapt_compose.yaml.sh ./compose.yaml "${{ matrix.multiplugin }}" "${{ env.CI_TAG }}"

      - name: Pull images of this run from GHCR
        run: |
          docker pull postgres:15
          docker pull redis:latest
          docker pull ghcr.io/${{ github.repository }}/qiita:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/nginx:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/plugin_collector:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/${{ matrix.multiplugin }}:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/qtp-diversity:${{ env.CI_TAG }}
          docker pull ghcr.io/${{ github.repository }}/qtp-visualization:${{ env.CI_TAG }}

      - name: Log in to DockerHub Container Registry
        # this is to evade public pull rate limits of 100 pulls per 6h for redis and postgres images
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: "compose.yaml"
          services: |
            nginx
      - name: Show disk space
        if: failure()
        run: |
          df -h /

      - name: Check which qiita and plugin image is actually running
        run: |
          docker inspect ghcr.io/${{ github.repository }}/qiita:${{ env.CI_TAG }} --format '{{.Id}}'
          docker inspect ghcr.io/${{ github.repository }}/${{ matrix.multiplugin }}:${{ env.CI_TAG }} --format '{{.Id}}'
      - name: Show docker compose logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Execute tests in the running services
        run: |
          sleep 5
          docker compose exec ${{ matrix.multiplugin }} /bin/bash -c "PLUGIN_FORK=jlab PLUGIN_BRANCH=uncouple_clientpush bash /test_plugin.sh"


  publish_images:
    needs:
      - build_plugins
      - build_main
      - build_mulit_plugins
    strategy:
      max-parallel: 3  # to avoid too many pushes at the very same time, which results in harbor time-outs
      matrix:
        image: ${{ fromJSON(needs.define_images.outputs.all) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tinqiita repo
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to computational.bio registry
        uses: docker/login-action@v4
        with:
          registry: harbor.computational.bio.uni-giessen.de
          username: ${{ vars.HARBOR_CB_USERNAME }}
          password: ${{ secrets.HARBOR_CB_SECRET }}

      - name: Pull image from GHCR
        run: docker pull ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ env.CI_TAG }}

      - name: Read image version from dockerfile
        id: vars
        run: |
          VERSION=$(head -n 1 Images/${{ matrix.image }}/${{ matrix.image }}.dockerfile | cut -d ":" -f 2- | tr -d " ")
          echo "IMAGE_TAG=$VERSION" >> $GITHUB_ENV

      - name: Determine harbor tags
        # pull request: only "dev"; merged into main (push event on main): version from dockerfile and "latest"
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "HARBOR_TAGS=${{ env.IMAGE_TAG }} latest" >> $GITHUB_ENV
          else
            echo "HARBOR_TAGS=dev" >> $GITHUB_ENV
          fi

      - name: Retag image for harbor
        run: |
          for TAG in ${{ env.HARBOR_TAGS }}; do
            docker tag ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ env.CI_TAG }} harbor.computational.bio.uni-giessen.de/tinqiita/${{ matrix.image }}:$TAG
          done

      - name: Push image to harbor
        run: |
          for TAG in ${{ env.HARBOR_TAGS }}; do
            for i in 1 2 3; do
              docker push harbor.computational.bio.uni-giessen.de/tinqiita/${{ matrix.image }}:$TAG && break
              echo "Pushing image ${{ matrix.image }}:$TAG failed, retry $i starts in $(( (${{ strategy.job-index }} + 1) * 30 )) sec..."
              sleep $(( (${{ strategy.job-index }} + 1) * 30 ))
            done
          done

  # remove the temporary run-specific images from GHCR once everything has been published.
  # Only on success: if a run fails, its images stay available so that "re-run failed jobs" keeps working.
  cleanup_ghcr:
    needs: publish_images
    if: success()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.define_images.outputs.all) }}
    steps:
      - name: Delete ${{ env.CI_TAG }} version of ghcr image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
        run: |
          PKG=$(echo "${{ github.event.repository.name }}/${{ matrix.image }}" | sed 's|/|%2F|g')
          BASE="/$OWNER_TYPE/${{ github.repository_owner }}/packages/container/$PKG/versions"
          IDS=$(gh api --paginate "$BASE?per_page=100" --jq '.[] | select(.metadata.container.tags | index("${{ env.CI_TAG }}")) | .id') || true
          for ID in $IDS; do
            gh api -X DELETE "$BASE/$ID" || echo "WARNING: could not delete version $ID of ${{ matrix.image }}"
          done
