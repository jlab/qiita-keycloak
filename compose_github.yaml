  qp-deblur:
    image: janssenlab/qp-deblur:latest
    command: ['./start_qp-deblur.sh']
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
