      qp-deblur:
        condition: service_started
      # qp-qiime2:
      #   condition: service_started
      # qtp-job-output-folder:
      #   condition: service_started
    environment:
      - QIITA_PLUGINS="qp-deblur:"
    command: ['/start_plugin_collector.sh']

networks:
  qiita-net:
    name: qiita-net

volumes:
  postgres-data:
  qiita-data:
  server-plugin-configs: # a shared directory on qiita server side (master and workers) to collect qiita plugin configuration files
