[ req ]
default_bits = 2048
prompt = no
default_md = sha256
req_extensions = req_ext
distinguished_name = dn

[ dn ]
C = DE
ST = Hesse
L = Giessen
O = JLU
OU = tinqiita
CN = localhost

[ req_ext ]
subjectAltName = @alt_names

[ alt_names ]
IP.1 = 127.0.0.1
DNS.1 = localhost
DNS.2 = tinqiita-nginx-1
DNS.3 = keycloak.local
DNS.4 = keycloak
DNS.5 = qiita.local
