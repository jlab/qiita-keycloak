services:
  qiita-db:
    image: postgres:15
    container_name: qiita-db
    hostname: qiita-db
    restart: no
    env_file:
      - ./environments/qiita_db.env
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    volumes:
      - './environments/qiita-db-init.sh:/docker-entrypoint-initdb.d/qiita-db-init.sh'
      - 'postgres-data:/var/lib/postgresql/data'
      - server-plugin-configs:/qiita_plugins
    networks:
      - qiita-net
    ports:
      - "15432:5432"

  qiita:
      image: local-qiita:latest 
      build: # image wird hier direkt gebaut
        context: ./Images/qiita
        dockerfile: Dockerfile
      command: ['/start_qiita.sh'] # executes bash script inside the container
      # entrypoint: /bin/bash
      # stdin_open: true
      # tty: true
      # ports:
        # - "21174:21174"  # wihtout nginx
        # - 127.0.0.1:8383:8383 #damit bur ich dran komme
      restart: no
      depends_on:
        - qiita_worker
      env_file:
        - './environments/qiita.env'
      environment:
        - QIITA_ROOTCA_CERT=/qiita/qiita_core/support_files/ci_rootca.crt
        - QIITA_CONFIG_FP=/qiita_configurations/qiita_server.cfg
        - PORT=21174
        - MASTER=--master
      volumes:
        - qiita-data:/qiita
        - ./logs:/logs
        - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
        - server-plugin-configs:/qiita_plugins
        # - ./Images/qiita/start_qiita.sh:/qiita/start_qiita.sh
      networks:
        - qiita-net
      ports:
      - "21174:21174"
    # deploy:
      #   replicas: 3
  qiita_worker:
      image: local-qiita:latest 
      build: # image wird hier direkt gebaut
        context: ./Images/qiita
        dockerfile: Dockerfile
      command: ['./start_qiita.sh'] # executes bash script inside the container
      # entrypoint: /bin/bash
      # stdin_open: true
      # tty: true
      # ports:
        # - "21174:21174"  # wihtout nginx
        # - 127.0.0.1:8383:8383 #damit bur ich dran komme
      restart: no
      depends_on:
        - redis
        - plugin_collector
      env_file:
        - './environments/qiita.env'
      environment:
        - QIITA_ROOTCA_CERT=/qiita/qiita_core/support_files/ci_rootca.crt
        - QIITA_CONFIG_FP=/qiita_configurations/qiita_server.cfg
        - PORT=21175
        - MASTER=
      volumes:
        - qiita-data:/qiita
        - ./logs:/logs
        - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
        - server-plugin-configs:/qiita_plugins
        # - ./Images/qiita/start_qiita_worker.sh:/qiita/start_qiita_worker.sh
      networks:
        - qiita-net
      deploy:
        replicas: 3
  redis:
    image: redis:latest
    restart: no
    command: >
      sh -c "redis-server --port 7777 &&
             redis-server --port 6379"
    volumes: 
      - qiita-data:/qiita
      - ./qiita_logs:/qiita_logs
    networks:
      - qiita-net
  #~ keycloak: # from https://stackoverflow.com/questions/78071458/keycloak-docker-compose
