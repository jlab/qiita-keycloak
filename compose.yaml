      #~ - qiita-net
  
  nginx:
    image: local-nginx_qiita:latest
    build:
      context: ./Images/nginx
      dockerfile: Dockerfile
    ports:
      - "8383:8383"
    command: ['./start_nginx.sh']
    # stdin_open: true
    # tty: true
    restart: no
    depends_on:
      - qiita
    volumes:
      - qiita-data:/qiita
      #- ./logs/nginx_access.log:/logs/nginx_access.log
      #- ./logs/nginx_error.log:/logs/nginx_error.log
      - ./logs:/logs
      - ./Images/nginx/nginx_qiita.conf:/qiita_configuration/nginx_qiita.conf
    networks:
      - qiita-net
  
  qtp-biom:
    image: local-qtp-biom:latest
    command: ['./start_qtp-biom.sh']
    # network_mode: host
    # stdin_open: true
    # tty: true
    restart: no
    volumes:
      - qiita-data:/qiita
      - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
    #depends_on:
    #- qiita
    networks:
      - qiita-net
      
  plugin_collector:
    image: local-plugin_collector
    restart: no
    networks:
      - qiita-net
    volumes:
      - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
      - server-plugin-configs:/qiita_plugins
      - qiita-data:/qiita
      #- /Daten/Git/jlab/qiita_container_anna/Images/plugin_collector/collect_configs.py:/collect.py
      #- /Daten/Git/jlab/qiita_container_anna/Images/plugin_collector/fix_test_db.py:/fix_test_db.py
    depends_on:
      - qtp-biom  # one of the plugins
      - qiita-db  # as values in qiita DB might be updated
    environment:
      - QIITA_PLUGINS="qtp-biom:"
    command: ['/startup_plugin_collector.sh']

networks:
  qiita-net:
    name: qiita-net
    #external: true

 
volumes:
  postgres-data:
    name: qiita-postgres-data
  #~ keycloak-postgres-data:
    #~ name: keycloak-postgres-data
  qiita-data:
    name: qiita-data
  server-plugin-configs:
  #server-configurations: