name: tinqiita

services:
  qiita-db:
    image: postgres:15
    container_name: qiita-db
    hostname: qiita-db
    restart: no
    env_file:
      - ./environments/qiita_db.env
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    volumes:
      - './environments/qiita-db-init.sh:/docker-entrypoint-initdb.d/qiita-db-init.sh'
      - 'postgres-data:/var/lib/postgresql/data'
      - server-plugin-configs:/qiita_plugins
    networks:
      - qiita-net
    ports:
      - "15432:5432"

  qiita-initialize-db:
    image: local-qiita:latest
    command: ['/start_qiita-initDB.sh']
    depends_on:
      - qiita-db
    env_file:
      - './environments/qiita.env'
    environment:
      - QIITA_CONFIG_FP=/qiita_configurations/qiita_server.cfg
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    volumes:
      - ./src/qiita:/qiita:U
      - qiita-data:/qiita_data
      - server-plugin-configs:/qiita_plugins
      - ./logs:/logs
      - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
      - ./Images/qiita/config_portal.cfg:/qiita_configurations/config_portal.cfg:r
    networks:
      - qiita-net

  qiita:
      image: local-qiita:latest
      build: # image wird hier direkt gebaut
        context: ./Images/qiita
        dockerfile: Dockerfile
      command: ['/start_qiita.sh'] # executes bash script inside the container
      # entrypoint: /bin/bash
      # stdin_open: true
      # tty: true
      # ports:
        # - "21174:21174"  # wihtout nginx
        # - 127.0.0.1:8383:8383 #damit bur ich dran komme
      restart: no
      depends_on:
        - qiita-worker
      env_file:
        - './environments/qiita.env'
      environment:
        #- QIITA_ROOTCA_CERT=/qiita_certificates/stefan_rootca.crt  # does not seem to have effect if not set in config file
        - QIITA_CONFIG_FP=/qiita_configurations/qiita_server.cfg
        - PORT=21174
        - MASTER=--master
        - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
      volumes:
        - qiita-data:/qiita_data
        - ./src/qiita:/qiita:U
        - ./logs:/logs
        - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
        - ./Images/qiita/config_portal.cfg:/qiita_configurations/config_portal.cfg:r
        - server-plugin-configs:/qiita_plugins
        - ./references/qiita_server_certificates:/qiita_certificates
        # - ./Images/qiita/start_qiita.sh:/qiita/start_qiita.sh
        - test_tmp_dir:/tmp
      networks:
        - qiita-net
      ports:
      - "21174:21174"
    # deploy:
      #   replicas: 3
  qiita-worker:
      image: local-qiita:latest
      build: # image wird hier direkt gebaut
        context: ./Images/qiita
        dockerfile: Dockerfile
      command: ['./start_qiita.sh'] # executes bash script inside the container
      # entrypoint: /bin/bash
      # stdin_open: true
      # tty: true
      # ports:
        # - "21174:21174"  # wihtout nginx
        # - 127.0.0.1:8383:8383 #damit bur ich dran komme
      restart: no
      depends_on:
        redis:
          condition: service_started
        plugin-collector:
          condition: service_completed_successfully
      env_file:
        - './environments/qiita.env'
      environment:
        #- QIITA_ROOTCA_CERT=/qiita_certificates/stefan_rootca.crt  # does not seem to have effect if not set in config file
        - QIITA_CONFIG_FP=/qiita_configurations/qiita_server.cfg
        - PORT=21175
        - MASTER=
        - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
      volumes:
        - qiita-data:/qiita_data
        - ./logs:/logs
        - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
        - ./Images/qiita/config_portal.cfg:/qiita_configurations/config_portal.cfg:r
        - server-plugin-configs:/qiita_plugins
        - ./references/qiita_server_certificates:/qiita_certificates
        - ./src/qiita:/qiita:U
        # - ./Images/qiita/start_qiita_worker.sh:/qiita/start_qiita_worker.sh
        - test_tmp_dir:/tmp
      networks:
        - qiita-net
      deploy:
        replicas: 3
  redis:
    image: redis:latest
    restart: no
    command: >
      sh -c "redis-server --port 7777 &&
             redis-server --port 6379"
    volumes:
      - qiita-data:/qiita
      - ./logs:/logs
    networks:
      - qiita-net
  #~ keycloak: # from https://stackoverflow.com/questions/78071458/keycloak-docker-compose
    #~ image: quay.io/keycloak/keycloak:24.0.2
    #~ container_name: keycloak
    #~ environment:
      #~ KC_DB: postgres
      #~ KC_DB_URL: jdbc:postgresql://keycloakdb:5432/keycloak
      #~ KC_DB_USERNAME: keycloak
      #~ KC_DB_PASSWORD: password

      #~ KC_HOSTNAME: keycloak
      #~ KC_HOSTNAME_PORT: 9999
      #~ KC_HOSTNAME_STRICT: false
      #~ KC_HOSTNAME_STRICT_HTTPS: false

      #~ KC_LOG_LEVEL: info
      #~ KC_METRICS_ENABLED: false
      #~ KC_HEALTH_ENABLED: true
      #~ KEYCLOAK_ADMIN: admin
      #~ KEYCLOAK_ADMIN_PASSWORD: admin
    #~ command: ["start-dev", "--http-port=9999"]
    #~ depends_on:
      #~ - keycloakdb
    #~ ports:
      #~ - 127.0.0.1:9999:9999
    #~ networks:
      #~ - qiita-net

  #~ keycloakdb:
    #~ image: postgres:15
    #~ volumes:
      #~ - keycloak-postgres-data:/var/lib/postgresql/data
    #~ environment:
      #~ POSTGRES_DB: keycloak
      #~ POSTGRES_USER: keycloak
      #~ POSTGRES_PASSWORD: password
    #~ networks:
      #~ - qiita-net

  nginx:
    image: local-nginx_qiita:latest
    build:
      context: ./Images/nginx
      dockerfile: Dockerfile
    ports:
      - "8383:8383"
    command: ['./start_nginx.sh']
    # stdin_open: true
    # tty: true
    restart: no
    depends_on:
      - qiita
    volumes:
      - qiita-data:/qiita_data
      #- ./logs/nginx_access.log:/logs/nginx_access.log
      #- ./logs/nginx_error.log:/logs/nginx_error.log
      - ./logs:/logs
      - ./Images/nginx/nginx_qiita.conf:/qiita_configuration/nginx_qiita.conf
      - ./references/qiita_server_certificates:/qiita_certificates
    networks:
      - qiita-net

  qtp-biom:
    image: local-qtp-biom:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - ./src/qtp-biom:/qtp-biom:U
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  qtp-sequencing:
    image: local-qtp-sequencing:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  qp-target-gene:
    image: local-qp-target-gene:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - test_tmp_dir:/tmp
      - ./references/qp-target-gene:/databases/gg/13_8/rep_set
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  qtp-visualization:
    image: local-qtp-visualization:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  qtp-diversity:
    image: local-qtp-diversity:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  qp-deblur:
    image: local-qp-deblur:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - ./references/qp-deblur:/opt/conda/envs/deblur/share/fragment-insertion/ref
      #- ./src/qtp-biom:/qtp-biom:U
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  qp-qiime2:
    image: local-qp-qiime2:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
      - TZ=Europe/Berlin  # this is important to avoid a local timezone error! See https://forum.qiime2.org/t/qiime2-timezone-error/17410
    networks:
      - qiita-net

  qtp-job-output-folder:
    image: local-qtp-job-output-folder:latest
    restart: no
    volumes:
      - qiita-data:/qiita_data
      - ./references/qiita_server_certificates:/qiita_server_certificates
      - test_tmp_dir:/tmp
    environment:
      - QIITA_CLIENT_DEBUG_LEVEL=DEBUG
    networks:
      - qiita-net

  plugin-collector:
    # prior to qiita (master and worker) start up, iterates through the QIITA_PLUGINS : separated list of plugin containers
    # to compile all q*.conf files from plugin containers in the server-plugin-configs volume
    image: local-plugin_collector
    restart: no
    networks:
      - qiita-net
    volumes:
      - ./Images/qiita/config_qiita_oidc.cfg:/qiita_configurations/qiita_server.cfg:r
      - server-plugin-configs:/qiita_plugins
      - qiita-data:/qiita_data
    depends_on:
      qiita-initialize-db:
        condition: service_completed_successfully
      qtp-biom:  # one of the plugins
        condition: service_started
      qtp-sequencing:
        condition: service_started
      qp-target-gene:
        condition: service_started
      qtp-visualization:
        condition: service_started
      qtp-diversity:
        condition: service_started
      qp-deblur:
        condition: service_started
      qp-qiime2:
        condition: service_started
      qtp-job-output-folder:
        condition: service_started
    environment:
      - QIITA_PLUGINS="qtp-biom:qtp-sequencing:qp-target-gene:qtp-visualization:qtp-diversity:qp-deblur:qp-qiime2:qtp-job-output-folder:"
      #- QIITA_PLUGINS="qp-target-gene:"
    command: ['/start_plugin_collector.sh']

networks:
  qiita-net:
    name: qiita-net
    #external: true


volumes:
  postgres-data:
  #~ keycloak-postgres-data:
    #~ name: keycloak-postgres-data
  qiita-data:
  server-plugin-configs: # a shared directory on qiita server side (master and workers) to collect qiita plugin configuration files
  test_tmp_dir: # many of plugin tests are written under the assumption that they are executed on same machine as qiita main and thus share /tmp - which is not the case in our docker compose scenario!
  